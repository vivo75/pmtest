# Known, justified portuale-vs-real-Portage divergences on the
# *fixture* tree (differential-test-bed/run/l0-fixture-oracle.sh, backlog #49). Same
# schema as `known-divergences.yaml` (see its header for the field
# documentation); findings land here only after adjudication, and an
# `owner: portuale-bug` entry is a filed bug being suppressed so the
# layer can gate everything else.
#
# Keep this file sorted by id.

# -- presentation: the staging makes ROOT != "/", real appends
#    ` for <configroot>/` to its masked/unmet messages while portuale
#    (whose fixture env never has that suffix) does not.

- id: fixture-masked-path-suffix
  categories: [advice, error]
  slugs: ["*"]
  match: "for /tmp/l0-fixture-oracle/fixtures/"
  reason: >
    Real's masked-atom / unmet-requirements messages append the target
    configroot path when it is not "/"; the staged oracle copy must live
    outside / for the fixture vdb to be the target root, and portuale's
    own fixture harness has no such suffix. The compared content (atom,
    reason) is identical.
  owner: portuale-oracle

- id: fixture-masked-atom-synthesis
  category: advice
  slugs: ["*"]
  match: "masked-atom:"
  reason: >
    The comparator derives `masked-atom: <atom>` from the `"<atom>" have
    been masked` line; real's copy of that line carries the staging path
    suffix, so only portuale's yield the derived atom. Real's line is
    itself explained by `fixture-masked-path-suffix`; the atom set is the
    same.
  owner: portuale-oracle

- id: fixture-unmet-requirements-wording
  categories: [error]
  slugs: ["*"]
  match: "has unmet requirements."
  reason: >
    Real's unmet-requirements line carries the staged root suffix; both
    sides print the same sentence otherwise (the real-only `Problem
    resolving dependencies for X` header is covered by the same entry's
    sibling).
  owner: portuale-oracle

- id: fixture-problem-resolving-header
  categories: [error]
  slugs: ["*"]
  match: "Problem resolving dependencies for"
  reason: >
    Real prints a `!!! Problem resolving dependencies for <atom>` header
    before the unmet-requirements line; portuale prints the same failure
    without that header. Output wording, not resolver behaviour.
  owner: portuale-oracle

- id: fixture-miss-message-unsuffixed
  categories: [advice, error]
  slugs: ["*"]
  match: "there are no ebuilds"
  reason: >
    Same staging-artifact class as fixture-masked-message-unsuffixed, for
    the two sentences #135 (d) (Phase 5b S2) put on portuale's side:
    `there are no ebuilds to satisfy` and `there are no ebuilds built
    with USE flags to satisfy`. Real's copies carry the staged target
    root (`for /tmp/l0-fixture-oracle/fixtures/.`, explained by
    fixture-masked-path-suffix); portuale's deliberately do not (the
    contract pins and the top-level miss keep the unsuffixed form). The
    atom and the chain rows are identical.
  owner: portuale-oracle

- id: fixture-masked-message-unsuffixed
  categories: [advice, error]
  slugs: ["*"]
  match: "All ebuilds that could satisfy"
  reason: >
    Portuale's copy of the masked-atom message has no staging-path suffix
    (real's is explained by `fixture-masked-path-suffix`); the atom and
    the masked package set are the same.
  owner: portuale-oracle

# -- #65 S0/S1/S2 + #71: the slot-operator bdeps matrix (FX_SLOTOP_BDEP=1
#    FX_HOST_ROOTS=1, differential-test-bed/atomlists/l0-fixture-oracle-slotop.txt). The
#    two artifact entries (totals duplication, the considep extra) were
#    deleted by the #71 S1 re-scope: with host-exact roots real and
#    portuale agree on set and Total: in every argument/option cell.
#    What remains is a genuine merge-order divergence in the three
#    @world cells (below).

# -- the skipped-update warning block (compared since backlog #227).

- id: g216-b0-cycle-abort-tree-ancestors
  categories: [extra, order]
  slugs: ["--backtrack_0_app-misc_g216top"]
  reason: >
    Under --backtrack=0 both sides abort on the g216 self-cycle with rc 1,
    the same cycle block and Total: 3; only the forced --tree display of
    the abort partial differs: portuale drains [top, mid, comp] and the
    tree walk adds app-misc/g216top and dev-libs/g216mid as [nomerge]
    ancestors, real prints three ordered rows. Backlog #245 (needs real's
    --debug digraph for the cell).
  owner: portuale-bug

- id: skipped-updates-installed-consumer-residue
  category: skipped-updates
  slugs:
    - "--update_--deep_--newuse_--oneshot_dev-libs_r25target"
  match: "skipped-update block present for portuale, absent for real"
  reason: >
    Portuale reconciles an installed world consumer's pin after the pass
    and prints the skipped-update warning; real carries the consumer as a
    complete-graph nomerge node, settles in pass 1 and prints nothing.
    This is backlog #25's residue (S1c, `_minimize_children`, waits for
    the slot-operator update probe #211; batch-2026-09-27 B13).
  owner: portuale-bug

- id: skipped-updates-use-display
  category: skipped-updates
  slugs:
    - "--backtrack_0_dev-libs_blk0a_dev-libs_blk0b_dev-libs_blk0c"
    - "--backtrack_0_dev-libs_blk0b_dev-libs_blk0a_dev-libs_blk0c"
    - "--backtrack_0_dev-libs_blk0b_dev-libs_blk0c_dev-libs_blk0a"
    - "--backtrack_0_dev-libs_blk0c_dev-libs_blk0b_dev-libs_blk0a"
    - "--update_--deep_--newuse_--oneshot_dev-libs_whpuller"
    - "--changed-slot_dev-libs_reinstslottarget"
    - "--changed-slot_--update_--deep_dev-libs_reinstslottarget"
  match: "skipped-update explanation differs"
  reason: >
    Same skipped packages on both sides; real renders each package's
    `pkg_use_display` (USE plus USE_EXPAND groups) and ` to '<root>'` on
    the block's lines, portuale prints `USE=""` and no root suffix.
    The whpuller and #210 reinstslottarget cells were first misread as
    presence findings (real's ` for <root>` header was not parsed).
    Backlog #230.
  owner: portuale-bug

- id: slotop-world-complete-graph-order
  category: order
  slugs:
    ["-uDvN__world", "-uDvN_--usepkg__world", "-uDvN_--with-bdeps_y__world"]
  match: "merge order diverges"
  reason: >
    Standing merge-order class (#17, deliberate cut): in the staged
    matrix's `@world` shape real's complete-graph rebuild order is
    `consbdep, consdep, considep, conspdep, consrdep` (the order its
    `_complete_graph` `_unsatisfied_deps` re-probe reaches them) while
    portuale emits them in dependency-discovery order
    `consrdep, consdep, consbdep, conspdep, considep`. The set and the
    `Total:` row match; only the sequence differs, the same family as
    the host L0 "order" findings. Adjudicated here so the slotop matrix
    can run host-exact; a merge-order port is #17's parked work, not
    #71's. See `differential-test-bed/findings/l0.md` "#71 S1".
  owner: portuale

