# -- #85 (DONE 2026-09-18): two new slots of one cp, pulled by
#    different parents, merged in the opposite order. S0 proved this
#    was not the #17 frontier-drain wall: real's `--debug` digraph dump
#    shows `treeslotuser` has NO edge to 1.10 at all -- real's
#    `_minimize_children` (`depgraph.py:4751-4856`) eliminates the
#    redundant 1.10 selection (`:0` matches only 1.9, the bare atom
#    matches both), so the bias parent-count ties 1-1 and discovery
#    order decides. Portuale's `select_dep_target` ranked the bare atom
#    vercmp-highest independently, adding the extra `user → 1.10` edge
#    that flipped the bias. Now ported in the shared helper (both
#    `build_digraph` and `print_tree` through `resolved_dep_targets`),
#    the bed cell is byte-equal, and the entry is deleted.
