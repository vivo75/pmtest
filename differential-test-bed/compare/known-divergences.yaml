- id: l2-gpkg-dostrip-splitdebug
  layer: l2
  category: SYMLINK
  path_glob: "/usr/lib/debug/.build-id/e0/2277*"
  reason: >
    #38 S0/S2: `porttest/setuid` installs three byte-identical binaries
    (pt-setuid/pt-setgid/pt-sticky) that share one build-id; `estrip`
    processes ELFs through `___parallel` and whichever name its
    `__try_symlink` sees first becomes the target of the shared
    `.build-id/e0/2277…` links. Real disagrees with itself: the
    2026-09-08 oracle links `pt-setuid`, the 2026-09-13 real L2 build
    links `pt-sticky`. Ungradable by construction; narrowed to this one
    link pair. Everything else (paths, sizes, payloads, CONTENTS) now
    matches the portage-built sibling exactly.
  owner: portuale-bug

- id: l2-gpkg-dostrip-splitdebug-contents
  layer: l2
  category: CONTENTS
  path_glob: "porttest/setuid-1.0/CONTENTS"
  match: "sym /usr/lib/debug/.build-id/e0/2277"
  reason: "VDB CONTENTS sym-target residue of the same ungradable build-id link race."
  owner: portuale-bug

- id: l2-vm-repo-revisions-vdb
  layer: l2
  category: VDB
  path_glob: "*/REPO_REVISIONS"
  match: "portuale='{}'"
  reason: >
    Portuale hardcodes PORTAGE_REPO_REVISIONS="{}" ("until portuale
    tracks a repo revision", emerge_build.rs); real fills SHAs via git
    retrieve_head whenever git exists. The VM golden has git (repo
    clones need it) so real records SHAs; the container image has no
    git so real writes {} there too. Same single cause as the archive
    rows (l2-vm-repo-revisions* in the L2-VM classifier). Filed in
    differential-test-bed/vm/FINDINGS.md; delete when portuale tracks
    revisions.
  owner: portuale-bug

- id: l2-vm-repo-revisions-vdb-env
  layer: l2
  category: VDB
  path_glob: "*/environment"
  reason: >
    The merged-VDB echo of the same gap: environment dumps differ only
    in the PORTAGE_REPO_REVISIONS line (verified byte-level: 1 line in
    1308). Masking tradeoff, stated plainly: this matches on the file
    name, so a future unrelated env delta would hide here too --
    re-tighten when the gap closes. Same filing as above.
  owner: portuale-bug

- id: l3-vm-repo-revisions-vdb
  layer: l3
  category: VDB
  path_glob: "*/REPO_REVISIONS"
  match: "portuale='{}'"
  reason: >
    Same root cause as l2-vm-repo-revisions-vdb, on source-built
    packages: portuale hardcodes PORTAGE_REPO_REVISIONS="{}", real
    fills SHAs via git retrieve_head (VM golden has git). Filed in
    differential-test-bed/vm/FINDINGS.md; delete when portuale tracks
    revisions.
  owner: portuale-bug

- id: l3-vm-repo-revisions-vdb-env
  layer: l3
  category: VDB
  path_glob: "*/environment"
  reason: >
    The merged-VDB echo of the same gap (dumps differ only in the
    PORTAGE_REPO_REVISIONS line). Same masking tradeoff as its l2
    sibling: re-tighten when the gap closes.
  owner: portuale-bug

