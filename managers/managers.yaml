# pmtest registry: ogni package manager sotto test ha una voce qui.
# I test risolvono `emerge`/`ebuild`/`mrg` tramite la voce attiva
# (PMTEST_PM=<nome>) invece di un `cargo build -p portuale` hardcoded.
# Stato: il cablaggio in tests/conftest.py è il prossimo passo;
# questo file è già il riferimento per i run manuali e per TEST/.
pms:
  portuale:
    type: portage-compatible
    emerge: /home/vivo/repo/PORTUALE/portuale/rust/target/release/portuale  # multicall argv[0]-dispatched
    ebuild: /home/vivo/repo/PORTUALE/portuale/rust/target/release/portuale
    version: f8c2142  # commit di portuale da cui l'infrastruttura è stata duplicata
  portage:
    type: reference
    emerge: /usr/sbin/emerge
    ebuild: /usr/bin/ebuild
    version: 3.0.82.2  # pin di riferimento L0/L1 (cfr. TEST/run/lib.sh L0_PORTAGE_PIN)
