# Known, justified portuale-vs-Portage divergences on the
# *fixture* tree (differential-test-bed/run/l0-fixture-oracle.sh, backlog #49). Same
# schema as `known-divergences.yaml` (see its header for the field
# documentation); findings land here only after adjudication, and an
# `owner: portuale-bug` entry is a filed bug being suppressed so the
# layer can gate everything else.
#
# Keep this file sorted by id.

# -- presentation: the staging makes ROOT != "/", Portage appends
#    ` for <configroot>/` to its masked/unmet messages while portuale
#    (whose fixture env never has that suffix) does not.

- id: fixture-masked-path-suffix
  categories: [advice, error]
  slugs: ["*"]
  match: "for /tmp/l0-fixture-oracle/fixtures/"
  reason: >
    Portage's masked-atom / unmet-requirements messages append the target
    configroot path when it is not "/"; the staged oracle copy must live
    outside / for the fixture vdb to be the target root, and portuale's
    own fixture harness has no such suffix. The compared content (atom,
    reason) is identical.
  owner: portuale-oracle

- id: fixture-masked-atom-synthesis
  category: advice
  slugs: ["*"]
  match: "masked-atom:"
  reason: >
    The comparator derives `masked-atom: <atom>` from the `"<atom>" have
    been masked` line; Portage's copy of that line carries the staging path
    suffix, so only portuale's yield the derived atom. Portage's line is
    itself explained by `fixture-masked-path-suffix`; the atom set is the
    same.
  owner: portuale-oracle

- id: fixture-unmet-requirements-wording
  categories: [error]
  slugs: ["*"]
  match: "has unmet requirements."
  reason: >
    Portage's unmet-requirements line carries the staged root suffix; both
    sides print the same sentence otherwise (the real-only `Problem
    resolving dependencies for X` header is covered by the same entry's
    sibling).
  owner: portuale-oracle

- id: fixture-problem-resolving-header
  categories: [error]
  slugs: ["*"]
  match: "Problem resolving dependencies for"
  reason: >
    Portage prints a `!!! Problem resolving dependencies for <atom>` header
    before the unmet-requirements line; portuale prints the same failure
    without that header. Output wording, not resolver behaviour.
  owner: portuale-oracle

- id: fixture-miss-message-unsuffixed
  categories: [advice, error]
  slugs: ["*"]
  match: "there are no ebuilds"
  reason: >
    Same staging-artifact class as fixture-masked-message-unsuffixed, for
    the two sentences #135 (d) (Phase 5b S2) put on portuale's side:
    `there are no ebuilds to satisfy` and `there are no ebuilds built
    with USE flags to satisfy`. Portage's copies carry the staged target
    root (`for /tmp/l0-fixture-oracle/fixtures/.`, explained by
    fixture-masked-path-suffix); portuale's deliberately do not (the
    contract pins and the top-level miss keep the unsuffixed form). The
    atom and the chain rows are identical.
  owner: portuale-oracle

- id: fixture-masked-message-unsuffixed
  categories: [advice, error]
  slugs: ["*"]
  match: "All ebuilds that could satisfy"
  reason: >
    Portuale's copy of the masked-atom message has no staging-path suffix
    (Portage's is explained by `fixture-masked-path-suffix`); the atom and
    the masked package set are the same.
  owner: portuale-oracle

# -- #65 S0/S1/S2 + #71: the slot-operator bdeps matrix (FX_SLOTOP_BDEP=1
#    FX_HOST_ROOTS=1, differential-test-bed/atomlists/l0-fixture-oracle-slotop.txt). The
#    two artifact entries (totals duplication, the considep extra) were
#    deleted by the #71 S1 re-scope: with host-exact roots Portage and
#    portuale agree on set and Total: in every argument/option cell.
#    What remains is a genuine merge-order divergence in the three
#    @world cells (below).

# -- the skipped-update warning block (compared since backlog #227).
#
# (Backlog #242 Slice D retired `skipped-updates-cross-root-missed-line`:
# the main list now runs with FX_HOST_RUNNING_ROOT=1, so portuale resolves
# the blk0 build deps against the container host like Portage does — the
# missed dev-libs/blk0x instance sits in `/` and paints the host profile's
# USE_EXPAND on both sides. Entry removed; if the bed ever flags the
# missed-line USE again, re-add it with fresh bytes rather than this text.)

- id: slotop-provider-r-on-upgrade
  category: flags
  slugs: ["*"]
  match: "real flags [r U] vs portuale [U]"
  reason: >
    Decided difference (#810, #819, owner 2026-11-28): Portage's backtrack
    files the installed provider into `slot_operator_replace_installed`
    after a slot conflict (provpkg-2.0 from the world atom against the
    installed consumers' `>=provpkg-1.0:0/1=` pin, `_slot_operator_update_backtrack`,
    depgraph.py:2459), which its display turns into `r  U`; the same upgrade
    without that conflict prints a plain `U`. portuale prints `r` only for a
    reinstall of the same version, never for an upgrade, so the mark means
    the same in every plan. The plan is the same: the provider upgrade and
    the five rebuilds, with `r` on the consumers. The consumers' "causes
    rebuilds" block names why they rebuild.
  owner: portuale

- id: slotop-world-complete-graph-order
  category: order
  slugs:
    ["-uDvN__world", "-uDvN_--usepkg__world", "-uDvN_--with-bdeps_y__world"]
  match: "merge order diverges"
  reason: >
    Standing merge-order class (#17, deliberate cut): in the staged
    matrix's `@world` shape Portage's complete-graph rebuild order is
    `consbdep, consdep, considep, conspdep, consrdep` (the order its
    `_complete_graph` `_unsatisfied_deps` re-probe reaches them) while
    portuale emits them in dependency-discovery order
    `consrdep, consdep, consbdep, conspdep, considep`. The set and the
    `Total:` row match; only the sequence differs, the same family as
    the host L0 "order" findings. Adjudicated here so the slotop matrix
    can run host-exact; a merge-order port is #17's parked work, not
    #71's. See `differential-test-bed/findings/l0.md` "#71 S1".
  owner: portuale

# -- #817 (DECIDED 2026-11-28, #698): the pin holder follows the update. The
#    whpin cell (`FX_WORLD_EXTRA=dev-libs/whtarget`, atomlist
#    l0-fixture-oracle-whpin.txt, #91 S2): `whtarget-1.0` pins
#    `~dev-libs/whblocker-1.0`. Portage keeps `whblocker-2.0` back and
#    merges `whpuller-2.0` only; portuale updates `whtarget` to 2.0 (a
#    visible same-slot version whose dependencies accept `whblocker-2.0`)
#    and `whblocker` with it, so the pin is not left stale.

- id: whpin-pin-holder-follows-update-698
  categories: [skipped-updates, extra]
  slugs: ["--update_--deep_--newuse_--oneshot_dev-libs_whpuller"]
  match:
    - "skipped-update block present for real, absent for portuale: dev-libs/whblocker:0"
    - "ebuild dev-libs/whtarget-2.0 present for portuale, absent for real"
    - "blocks <dev-libs/whtarget-2.0 present for portuale, absent for real"
    - "ebuild dev-libs/whblocker-2.0 present for portuale, absent for real"
  reason: >
    Decided difference (#817, from the 2026-11-28 bed run; #698 owner
    decision: the complete plan and charter before Portage parity). A
    holder of a pin that blocks an update gets a route to the new provider
    when the tree has a same-slot, not-older version whose dependencies
    accept it; then the holder and the provider are one plan. Here
    `whtarget-2.0` routes to `whblocker-2.0`, so portuale upgrades
    `whblocker`, `whpuller` and `whtarget` together, and the skipped-update
    block Portage prints has nothing to skip. Charter property 3 (as new
    as possible) is met and property 1 holds: no installed package is left
    with an unsatisfied pin. The `blocks` row is the soft (`b`) blocker of
    `whtarget-2.0` on `whblocker-2.0`, both planned by the same merge.
    Portage withholds the update, which leaves `whblocker` at 1.0 under a
    holder that still needs it to stay old. Oracle: charter properties 1
    and 3; #698 and Portage 3.0.83 as a comparison.
  owner: portuale

