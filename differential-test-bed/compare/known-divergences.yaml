- id: l0-vm-system-virtual-order
  layer: l0
  backend: vm
  categories: [order]
  slugs: ["_system", "_world"]
  match: "real virtual/editor vs portuale virtual/libc"
  reason: >
    Accepted variance per the virtual-resolution rules (owner decision
    2026-09-19): nano-9.2 and glibc-2.43-r2 are installed, both PMs
    keep them (identical R rows, no provider switch), @world pins
    neither provider -- rules 1-3 hold identically on both sides and
