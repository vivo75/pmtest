# pmtest registry: every package manager under test gets one entry here.
# Tests resolve `emerge`/`ebuild`/`mrg` through the active entry
# (PMTEST_PM=<name>, default: portuale) instead of a hardcoded
# `cargo build -p portuale` -- see pytests-contract-suite/conftest.py and managers/README.md.
# Relative paths resolve against the pmtest root.
#
# `version:` is what a published report cites, so it is not written by
# hand: `git` = short commit of <repo> (+ `-dirty` when that checkout has
# uncommitted changes), `latest` = what the binary answers to
# `--version`. Any other value is used verbatim.
pms:
  portuale:
    type: portage-compatible
    repo: ../portuale  # source tree; cargo builds run in <repo> (workspace root)
    package: portuale  # cargo package for the emerge/ebuild/mrg multicall
    emerge: ../portuale/target/release/portuale  # argv[0]-dispatched multicall
    ebuild: ../portuale/target/release/portuale
    mrg: ../portuale/target/release/portuale
    version: git
  portuale-bed:
    # Frozen copy of the portuale binary for bed runs, so cargo can rebuild
    # target/release meanwhile. Refresh: cp -p ../portuale/target/release/portuale /var/tmp/bedbin/
    # Run with PMTEST_PM=portuale-bed PMTEST_NO_BUILD=1.
    type: portage-compatible
    repo: ../portuale
    package: portuale
    emerge: /var/tmp/bedbin/portuale
    ebuild: /var/tmp/bedbin/portuale
    mrg: /var/tmp/bedbin/portuale
    version: git
  portage-cli:
    type: portage-compatible
    repo: 3rdparty/portage-cli  # lu-zero/portage-cli, see 3rdparty/repos.toml
    package: portage-cli        # cargo package of the `em` binary
    emerge: 3rdparty/portage-cli/target/release/em  # bare `em` is emerge
    ebuild: managers/shims/portage-cli/ebuild       # `em ebuild`, no argv[0] dispatch
    mrg: ~                      # `~` = not shipped: the tests that need it skip
    versions_harness: ~
    atom_harness: ~
    use_reduce_harness: ~
    required_use_harness: ~
    version: git
  portage:
    type: reference
    emerge: /usr/sbin/emerge
    ebuild: /usr/bin/ebuild
    version: latest
    # The portage the container upgrades to for L0/L1 is a separate pin:
    # L0_PORTAGE_PIN in differential-test-bed/run/lib.sh's callers.
