# pmtest registry: every package manager under test gets one entry here.
# Tests resolve `emerge`/`ebuild`/`mrg` through the active entry
# (PMTEST_PM=<name>, default: portuale) instead of a hardcoded
# `cargo build -p portuale` -- see tests/conftest.py and managers/README.md.
# Relative paths resolve against the pmtest root.
pms:
  portuale:
    type: portage-compatible
    repo: ../portuale  # source tree; cargo builds run in <repo>/rust
    package: portuale  # cargo package for the emerge/ebuild/mrg multicall
    emerge: ../portuale/rust/target/release/portuale  # argv[0]-dispatched multicall
    ebuild: ../portuale/rust/target/release/portuale
    mrg: ../portuale/rust/target/release/portuale
    version: f8c2142  # commit di portuale da cui l'infrastruttura è stata duplicata
  portage:
    type: reference
    emerge: /usr/sbin/emerge
    ebuild: /usr/bin/ebuild
    version: 3.0.82.2  # pin di riferimento L0/L1 (cfr. TEST/run/lib.sh L0_PORTAGE_PIN)
