#    different parents, merged in the opposite order. S0 proved this
#    was not the #17 frontier-drain wall: Portage's `--debug` digraph dump
#    shows `treeslotuser` has NO edge to 1.10 at all -- Portage's
#    `_minimize_children` (`depgraph.py:4751-4856`) eliminates the
