# Known, justified Portuale-vs-Portage divergences.
#
# A finding produced by a comparator (resolve-compare.py for L0; diff.py
# for L1+) is *explained* when it matches an entry here; a run is GREEN
# iff every finding is explained. New unexplained findings must be
# triaged into one of:
#   * Portuale bug   -> fix it, do not add an entry
#   * Portage bug    -> add an entry with a `ticket:`, report upstream
#   * environmental  -> add an entry with a `reason:` (nondeterminism,
#                       host state, a deliberate Portuale design cut)
#
# Entry schema (all keys optional except that an entry must constrain
# *something* -- an entry that constrains nothing matches nothing):
#
#   id:         short kebab-case handle (shown in reports)
#   layer:      l0 | l0-pubgrub | l1 | l2 | l3 | l4 | l5   (default l0)
#               (`l0-pubgrub` = backlog #34 pubgrub parity mode entries,
#               graded with resolve-compare.py --count-categories)
#   categories: [missing, extra, version, flags, action, columns, use, order, error,
#                exit, totals, advice]  -- or `category:` for a single one
#                (`advice` = a needed USE change / mask / REQUIRED_USE
#                 diagnostic that only one side emits)
#   slugs:      list of probe-slug globs (e.g. "app-editors_vim",
#               "MULTI_*"); '*' is the only wildcard
#   match:      substring that must appear in the finding detail
#   fs:         filesystem(s) this entry applies to, string or list
#               (e.g. `xfs` or `[ext4, btrfs]`) -- VM bed matrix only.
#               Absent = every filesystem. A run graded with `--fs NAME`
#               is explained by nothing qualified for another fs.
#   backend:    `vm` or `container` -- entries for guest-state findings
#               that only occur on one backend (e.g. a newer installed
#               set in the VM image). Absent = both backends. Grade with
#               `--backend NAME`; unqualified runs match nothing qualified.
#   reason:     why this is not a Portuale bug   (required in spirit)
#   ticket:     upstream/issue reference, if any
#   owner:      who adjudicated it
#
# Keep this file sorted by id. Every entry is a deliberate, reviewed
# decision. An entry tagged `owner: portuale-bug` is a KNOWN bug being
# suppressed only so the layer can still gate *other* changes -- it must
# be deleted the moment the bug is fixed (see the finding it names).

# (empty -- L1-c fixed on `main`; the `l1-env-binpkg-not-refiltered`
#  entry that stood here is gone. The L1-f phase-env-inheritance residue
#  is handled by normalize.py's ENV_DROP, not an allowlist entry.)

- id: gedit-nautilus-cluster-a-rewalk-abort
  categories: [order]
  slugs: ["app-editors_gedit", "gnome-base_nautilus"]
  match: "real net-libs/nghttp2 vs portuale"
  reason: >
    Cluster-A abort residue (the F-B5 family), not a #17/#25 order bug.
    Portage's `_solve_non_slot_operator_slot_conflicts` removes the installed
    systemd that polkit's `systemd[policykit]` supersedes, then re-walks
    the removed node's parents to point their edges at the merge. In
    these two probes that re-walk aborts at gnome-keyring's unsatisfiable
    `>=app-crypt/gcr-3.27.90:0=[gtk]` (the probe's own rc-1 failure), so
    the parents still on the stack (nghttp2, pam, shadow, pambase,
    service-manager) lose their systemd edge; nghttp2 then merges early
    (#5 / #8). Which parents miss out is CPython set order under
    PYTHONHASHSEED=0 and cannot be ported; completed re-walks
    (networkmanager and others) redirect the edges exactly as portuale
    does. Only the `[order]` row is covered: the `[advice]`/`[error]`
    rows are portuale's still-open masked-dependency disclosure gap.
    Evidence: differential-test-bed/findings/l0.md "R3c revalidation" (backlog #25, D7).
  owner: claude-opus-5

- id: gnome-shell-cluster-a-abort
  categories: [order, extra, totals, advice, error]
  slugs: ["gnome-base_gnome-shell"]
  reason: >
    Cluster-A abort-path bundle, not a #17 order bug: Portage abandons the
    resolve at the unsatisfiable USE-dep (`emerge: there are no ebuilds
    built with USE flags to satisfy ">=net-fs/samba-4.0.0[client]"`, the
    masked-required notice, rc 1) and prints a truncated merge list
    (Total 453). Portuale keeps going with an autounmask USE change
    (libcanberra pulseaudio) and exits 1 later (Total 454), so the
    `order #0` (real sys-apps/hwdata vs portuale app-crypt/libmd), the
    extra dev-lang/nasm row and the totals delta are downstream of the
    abort handling. Recorded as the gnome-shell cluster-A bundle in
    differential-test-bed/findings/l0.md (~948-952).
  owner: deepseek-v4.1-flash

